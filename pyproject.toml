[project]
name = "cobalt-verify"
version = "0.1.0"
description = "Offline verifier for Cobalt audit bundles — prove an agent-authority audit trail's integrity with nothing but the file."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0",
]

[project.scripts]
cobalt-verify = "cobalt_verify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cobalt_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
